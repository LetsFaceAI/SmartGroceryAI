name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# The workflow reads source code and publishes test results as a commit check.
permissions:
  contents: read
  checks: write

jobs:
  quality:
    name: Tests and code quality
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          # Match the local project tool version and invalidate the cache when the
          # committed lock file changes.
          version: "0.12.5"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install locked dependencies
        run: uv sync --locked --dev

      - name: Run tests
        run: uv run pytest --junitxml=reports/pytest.xml

      # Convert pytest's JUnit XML into a browsable check and job summary. Disabling
      # PR comments keeps the required GitHub token permissions narrowly scoped.
      - name: Publish test results
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@d0a4676d0e0b938bc201470d88276b7c74c712b3 # v2.24.0
        with:
          files: reports/pytest.xml
          comment_mode: off

      # Upload the report even when tests fail so the failure details remain
      # downloadable from the workflow run.
      - name: Upload pytest report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pytest-report
          path: reports/pytest.xml
          if-no-files-found: warn
          retention-days: 14

      - name: Lint with Ruff
        run: uv run ruff check .

      - name: Check formatting with Ruff
        run: uv run ruff format --check .

      - name: Type-check application
        run: uv run mypy app

# Core project metadata and Python compatibility requirements.
[project]
name = "smartgroceryai"
version = "0.1.0"
description = "An AI-powered grocery deal comparison and shopping-planning application."
readme = "README.md"
requires-python = ">=3.12,<3.13"
# Runtime dependencies belong here and are resolved reproducibly in uv.lock.
dependencies = [
    "langchain>=1.3.15",
    "langchain-openai>=1.5.2",
    "pydantic-settings>=2.15.0",
]

[dependency-groups]
# Development tools are installed by default with `uv sync`, but are not runtime
# requirements of the deployed application.
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.3",
]

# Pytest looks only in the dedicated tests directory. Strict configuration and
# marker handling catch misspelled options instead of silently ignoring them.
[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
# Make the current flat `app/` package importable when pytest uses its console script.
pythonpath = ["."]
addopts = ["-ra", "--strict-config", "--strict-markers"]

# Ruff provides one fast, consistent formatter and linter for the entire project.
[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
# Start with correctness, import ordering, Python upgrades, and common bug patterns.
# This catches meaningful issues without imposing highly opinionated style rules.
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.ruff.format]
# Format Python examples inside docstrings along with the surrounding source code.
docstring-code-format = true

# mypy checks that values crossing function and module boundaries have compatible
# types. New functions must be annotated, while strict mode is deferred until the
# project is large enough to justify its additional maintenance cost.
[tool.mypy]
python_version = "3.12"
files = ["app", "tests"]
check_untyped_defs = true
disallow_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
warn_redundant_casts = true
show_error_codes = true
pretty = true
